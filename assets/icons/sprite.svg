  <symbol id="icon-sliders" viewBox="0 0 24 24">
    <line x1="4" y1="7" x2="20" y2="7"/>
    <circle cx="14" cy="7" r="2" fill="var(--color-bg, #fff)"/>
    <line x1="4" y1="14" x2="20" y2="14"/>
    <circle cx="9" cy="14" r="2" fill="var(--color-bg, #fff)"/>
    <line x1="4" y1="21" x2="20" y2="21"/>
    <circle cx="16" cy="21" r="2" fill="var(--color-bg, #fff)"/>
