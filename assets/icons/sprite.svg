    <line x1="4" y1="17" x2="4.01" y2="17"/>
    <line x1="20" y1="17" x2="19.99" y2="17"/>
  </symbol>

  <!-- Impact gauge, added 2026-08-20: same dial, needle at a different position per level, so
       the icon itself reads as the amount rather than repeating the identical glyph three times. -->
  <symbol id="icon-impact-low" viewBox="0 0 24 24">
    <path d="M4 17a8 8 0 0 1 16 0"/>
    <line x1="12" y1="17" x2="7.3" y2="13.2"/>
    <line x1="4" y1="17" x2="4.01" y2="17"/>
    <line x1="20" y1="17" x2="19.99" y2="17"/>
  </symbol>

  <symbol id="icon-impact-medium" viewBox="0 0 24 24">
    <path d="M4 17a8 8 0 0 1 16 0"/>
    <line x1="12" y1="17" x2="12" y2="9"/>
    <line x1="4" y1="17" x2="4.01" y2="17"/>
    <line x1="20" y1="17" x2="19.99" y2="17"/>
  </symbol>

  <symbol id="icon-impact-high" viewBox="0 0 24 24">
    <path d="M4 17a8 8 0 0 1 16 0"/>
    <line x1="12" y1="17" x2="16.7" y2="13.2"/>
    <line x1="4" y1="17" x2="4.01" y2="17"/>
    <line x1="20" y1="17" x2="19.99" y2="17"/>
  </symbol>

  <symbol id="icon-disclosure" viewBox="0 0 24 24">
    <polyline points="6 9 12 15 18 9"/>
  </symbol>

  <symbol id="icon-previous" viewBox="0 0 24 24">
    <polyline points="15 5 8 12 15 19"/>
  </symbol>

  <symbol id="icon-next" viewBox="0 0 24 24">
    <polyline points="9 5 16 12 9 19"/>
  </symbol>

  <symbol id="icon-flip" viewBox="0 0 24 24">
    <path d="M4 9a8 8 0 0 1 14.5-3.5M20 15a8 8 0 0 1-14.5 3.5"/>
    <polyline points="18 2 18.5 5.5 15 6"/>
    <polyline points="6 22 5.5 18.5 9 18"/>
  </symbol>

  <symbol id="icon-replay" viewBox="0 0 24 24">
    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
    <polyline points="1 4 1 10 7 10"/>
  </symbol>

