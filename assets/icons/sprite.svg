    <line x1="12" y1="17" x2="16" y2="10.5"/>
    <line x1="4" y1="17" x2="4.01" y2="17"/>
    <line x1="20" y1="17" x2="19.99" y2="17"/>
  </symbol>

  <symbol id="icon-disclosure" viewBox="0 0 24 24">
