  <!-- ================= Furniture, added 2026-08-25 for the furnished doll house (DESIGN.md 3.2)
       Scenery only: none of these is ever pressed and none carries an accessible name. Drawn in the
       same pen as the icons above, but each in a viewBox of its own real proportion rather than a
       24 square, because a sofa is not square and forcing it into a square box is what makes a
       drawing read as an icon of a sofa rather than as a sofa. Rendered with a non-scaling stroke
       (components.css), since at furniture size a scaled 2-unit stroke comes out as a fat marker
       line. =================================================================================== -->

  <symbol id="prop-bed" viewBox="0 0 48 26">
    <path d="M2 22 L2 9 Q2 6 5 6 L43 6 Q46 6 46 9 L46 22"/>
    <path d="M2 14 L46 14"/>
