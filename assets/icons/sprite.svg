  </symbol>

  <symbol id="icon-print" viewBox="0 0 24 24">
    <rect x="7" y="3" width="10" height="6" rx="0.5"/>
    <rect x="5" y="9" width="14" height="7" rx="1"/>
    <rect x="7" y="14" width="10" height="7" rx="0.5"/>
