name: Check content

# Runs the content validator on every push. Gates nothing about publishing — GitHub Pages
# deploys straight from `main` regardless of this result, per architecture.md D8. This is a
# safety net, not a dependency.

on:
  push:
  pull_request:

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-content.mjs
      - run: node --test tools/
